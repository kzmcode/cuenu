# PWA + サーバーを利用者自身の Cloudflare アカウントへデプロイ（任意。手動実行のみ）。
# 前提: README の「セルフデプロイ」で D1 作成・wrangler 設定・Secret 登録を済ませていること。
#
# 必要な Secret（リポジトリの Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   利用者自身が作成した API トークン（Workers Scripts:Edit, D1:Edit, Account Settings:Read 程度）
#   CLOUDFLARE_ACCOUNT_ID  利用者の Cloudflare アカウント ID
# サーバーの Secret（OWNER_PASSWORD / GEMINI_API_KEY / VAPID 鍵）はこの workflow では扱わない（wrangler secret put で別途登録）。
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'D1 マイグレーション（remote）を適用する'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # API トークンは依存のスクリプトから読めないよう、使うステップにだけ渡す
    steps:
      - name: Secret 確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を設定してください"; exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: PWA ビルド
        run: pnpm --filter @cuenu/web build
      - name: D1 マイグレーション
        if: inputs.migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @cuenu/server run db:migrate:remote
      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @cuenu/server run deploy
